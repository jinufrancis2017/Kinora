
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Film — KINORA</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root{
  --film-accent:var(--accent,#8b7cff);
  --film-bg:#090b11;
  --film-panel:rgba(22,27,39,.76);
  --film-border:rgba(255,255,255,.09);
  --film-text:#edf1f7;
  --film-muted:#929bad;
  --film-glow:color-mix(in srgb,var(--film-accent) 20%,transparent);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 10% 0%,var(--film-glow),transparent 36%),
    radial-gradient(ellipse at 95% 35%,rgba(64,91,150,.10),transparent 32%),
    var(--film-bg);
  color:var(--film-text);
  font-family:inherit;
  min-height:100vh
}
button{font:inherit;cursor:pointer}

.film-topbar{
  min-height:65px;padding:0 22px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--film-border);
  background:rgba(10,13,20,.78);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:10
}
.film-brand{color:var(--film-text);text-decoration:none;font-size:21px;font-weight:800;letter-spacing:2px}
.film-brand span{color:var(--film-accent)}
.film-nav{display:flex;align-items:center;gap:17px}
.film-nav a{color:var(--film-muted);text-decoration:none;font-size:13px;transition:.2s}
.film-nav a:hover{color:var(--film-text)}

.film-main{width:min(1150px,100%);margin:auto;padding:25px 20px 70px}
.film-breadcrumb{color:var(--film-muted);font-size:12px;margin-bottom:22px}
.film-breadcrumb a{color:var(--film-muted);text-decoration:none}
.film-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}
.film-heading h1{font-size:clamp(25px,5vw,37px);line-height:1.15;margin:0;overflow-wrap:anywhere;letter-spacing:-.7px}
.film-year{color:var(--film-muted);font-size:14px;margin-top:7px}
.film-info-button{
  width:39px;height:39px;flex-shrink:0;border-radius:50%;
  border:1px solid var(--film-border);
  background:rgba(255,255,255,.055);color:var(--film-text);font-size:21px;
  transition:.2s
}
.film-info-button:hover{background:var(--film-glow);border-color:var(--film-accent)}

.film-hero{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:27px;
  align-items:start;padding:20px;
  background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
  border:1px solid var(--film-border);border-radius:18px;
  box-shadow:0 18px 55px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.045);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.film-poster{
  width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;
  background:#202633;border:1px solid var(--film-border);
  box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.film-poster-placeholder{
  aspect-ratio:2/3;display:grid;place-items:center;
  background:linear-gradient(145deg,#202633,#141923);
  border-radius:12px;color:var(--film-muted);text-align:center;padding:15px
}
.film-facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:17px}
.film-chip{
  background:rgba(255,255,255,.055);color:#c7cede;
  border:1px solid var(--film-border);padding:6px 10px;
  border-radius:20px;font-size:11px
}
.film-plot-title{font-size:15px;margin:0 0 9px}
.film-plot{color:#c5ccd8;font-size:14px;line-height:1.8;white-space:pre-wrap}

.film-section{margin-top:30px}
.film-section-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:14px;flex-wrap:wrap
}
.film-section-heading h2{font-size:19px;margin:0}
.film-section-heading h3{font-size:16px;margin:0}
.film-edit-button{
  border:1px solid var(--film-border);
  background:rgba(255,255,255,.055);color:var(--film-text);
  border-radius:9px;padding:8px 12px;font-size:11px;white-space:nowrap;
  transition:all .2s
}
.film-edit-button:hover{
  border-color:var(--film-accent);color:var(--film-accent);
  background:var(--film-glow);transform:translateY(-1px)
}

.film-scroll{
  display:flex;gap:14px;overflow-x:auto;padding:3px 2px 14px;
  scroll-snap-type:x mandatory;scrollbar-width:thin
}
.film-person-card{flex:0 0 145px;scroll-snap-align:start;min-width:0}
.film-person-photo{
  width:100%;height:170px;object-fit:cover;border-radius:12px;
  background:#202633;border:1px solid var(--film-border);
  box-shadow:0 8px 22px rgba(0,0,0,.18)
}
.film-person-placeholder{
  width:100%;height:170px;border-radius:12px;
  background:linear-gradient(145deg,#202633,#141923);
  display:grid;place-items:center;color:var(--film-muted);font-size:30px;
  border:1px solid var(--film-border)
}
.film-person-name{
  display:block;color:var(--film-text);font-size:13px;font-weight:700;
  line-height:1.4;margin-top:9px;text-decoration:none;overflow-wrap:anywhere
}
.film-person-name:hover{color:var(--film-accent)}
.film-person-role{display:block;color:var(--film-muted);font-size:11px;margin-top:4px;line-height:1.5}

.film-data-panel{
  background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--film-border);border-radius:13px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.12)
}
.film-data-row{
  padding:14px 16px;display:flex;justify-content:space-between;
  gap:20px;border-bottom:1px solid var(--film-border);font-size:13px
}
.film-data-row:last-child{border-bottom:0}
.film-data-label{color:var(--film-muted)}
.film-data-value{text-align:right;overflow-wrap:anywhere}

.film-tabs{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-top:35px;
  border-bottom:1px solid var(--film-border);scrollbar-width:thin
}
.film-tab{
  flex-shrink:0;padding:11px 14px;background:rgba(255,255,255,.025);
  color:var(--film-muted);border:1px solid transparent;
  border-radius:9px 9px 0 0;font-size:12px;transition:.2s
}
.film-tab:hover{color:var(--film-text);background:rgba(255,255,255,.05)}
.film-tab.active{
  color:var(--film-text);border-color:var(--film-border);
  border-bottom-color:var(--film-accent);
  background:var(--film-glow)
}
.film-tab-content{padding-top:20px}
.film-tab-content[hidden]{display:none}

.film-list{display:flex;flex-direction:column;gap:10px}
.film-list-item{
  display:flex;align-items:center;gap:13px;padding:13px;
  border-radius:12px;
  background:linear-gradient(120deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--film-border);
  box-shadow:0 7px 20px rgba(0,0,0,.12);
  transition:border-color .2s,transform .2s
}
.film-list-item:hover{border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.film-list-item img{
  width:52px;height:65px;border-radius:8px;object-fit:cover;
  background:#202633;border:1px solid var(--film-border)
}
.film-list-icon{
  width:43px;height:43px;flex-shrink:0;display:grid;place-items:center;
  border-radius:12px;background:var(--film-glow);
  border:1px solid var(--film-border);font-size:20px
}
.film-list-item strong{font-size:13px;display:block}
.film-list-item small{color:var(--film-muted);display:block;margin-top:5px;font-size:11px;line-height:1.5}

/* Soundtrack layout */
.soundtrack-cover-area{
  display:flex;align-items:center;gap:13px;
  margin-bottom:15px;padding:12px;
  border:1px solid var(--film-border);
  border-radius:12px;
  background:rgba(255,255,255,.025)
}
.soundtrack-cover{
  width:76px;height:76px;flex-shrink:0;
  object-fit:cover;border-radius:9px;
  background:#202633;border:1px solid var(--film-border)
}
.soundtrack-cover-placeholder{
  width:76px;height:76px;flex-shrink:0;
  display:grid;place-items:center;border-radius:9px;
  background:linear-gradient(145deg,#202633,#141923);
  color:var(--film-muted);font-size:25px
}
.soundtrack-cover-caption{
  color:var(--film-muted);font-size:11px;line-height:1.5
}
.soundtrack-track{
  padding:13px 14px;
  border:1px solid var(--film-border);
  border-radius:11px;
  background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.015))
}
.soundtrack-track-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px
}
.soundtrack-track-title{
  font-size:13px;font-weight:700;line-height:1.5;
  overflow-wrap:anywhere
}
.soundtrack-duration{
  flex-shrink:0;color:var(--film-muted);font-size:11px;
  padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--film-border)
}
.soundtrack-credits{
  display:flex;flex-direction:column;gap:5px;margin-top:9px
}
.soundtrack-credit-line{
  display:flex;align-items:flex-start;gap:7px;
  font-size:11px;line-height:1.55
}
.soundtrack-credit-label{
  flex:0 0 105px;color:var(--film-muted)
}
.soundtrack-credit-names{
  min-width:0;color:#d5dbea;overflow-wrap:anywhere
}
.soundtrack-credit-names a{
  color:var(--film-text);text-decoration:none
}
.soundtrack-credit-names a:hover{color:var(--film-accent)}
.soundtrack-credit-separator{color:var(--film-muted)}

.film-award{
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.018));
  border:1px solid var(--film-border);border-radius:12px;padding:16px;
  box-shadow:0 7px 20px rgba(0,0,0,.12)
}
.film-award strong{font-size:14px}
.film-award p{color:var(--film-muted);font-size:12px;line-height:1.6;margin:7px 0 0}
.film-empty{
  color:var(--film-muted);background:rgba(255,255,255,.025);
  border:1px dashed var(--film-border);border-radius:12px;
  padding:25px 18px;font-size:13px;text-align:center
}
.film-article-body{color:#cbd2df;line-height:1.85;font-size:14px;overflow-wrap:anywhere}
.film-article-body h2,.film-article-body h3{color:var(--film-text)}
.film-article-body a{color:var(--film-accent)}
.film-article-body img{max-width:100%;height:auto;border-radius:10px}
.film-article-body table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.film-article-body td,.film-article-body th{padding:9px;border:1px solid var(--film-border)}

.film-info-backdrop{
  display:none;position:fixed;inset:0;z-index:30;
  background:rgba(0,0,0,.72);backdrop-filter:blur(7px);
  align-items:center;justify-content:center;padding:18px
}
.film-info-backdrop.open{display:flex}
.film-info-modal{
  width:min(440px,100%);
  background:rgba(20,25,36,.96);backdrop-filter:blur(22px);
  border:1px solid var(--film-border);border-radius:17px;
  padding:21px;max-height:85vh;overflow-y:auto;
  box-shadow:0 25px 80px rgba(0,0,0,.45)
}
.film-info-modal h2{margin:0 0 17px;font-size:19px}
.film-info-close{float:right;background:transparent;border:0;color:var(--film-muted);font-size:22px}
.film-loading,.film-error{text-align:center;padding:65px 15px;color:var(--film-muted)}
.film-error{color:#ff8997}
.film-footer{color:var(--film-muted);font-size:11px;text-align:center;padding:35px 10px 0}

@media(max-width:650px){
  .film-topbar{padding:0 14px}
  .film-brand{font-size:18px}
  .film-nav{gap:11px}
  .film-nav a{font-size:12px}
  .film-main{padding:20px 13px 50px}
  .film-hero{grid-template-columns:115px minmax(0,1fr);gap:15px;padding:13px}
  .film-person-card{flex-basis:120px}
  .film-person-photo,.film-person-placeholder{height:145px}
  .film-data-row{padding:13px}
}
@media(max-width:380px){
  .film-hero{grid-template-columns:1fr}
  .film-poster,.film-poster-placeholder{width:min(190px,100%);margin:auto}
  .soundtrack-credit-label{flex-basis:90px}
}
</style>
</head>

<body>

<header class="film-topbar">
  <a class="film-brand" href="index.html">KINO<span>RA.</span></a>
  <nav class="film-nav">
    <a href="index.html">Explore</a>
    <a href="index.html#articles">Films</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<main class="film-main">
  <div class="film-breadcrumb">
    <a href="index.html">KINORA</a> / Films / <span id="breadcrumbTitle">Loading...</span>
  </div>

  <div id="filmContent">
    <div class="film-loading">Loading film article...</div>
  </div>

  <footer class="film-footer">KINORA — The Film &amp; Series Encyclopedia</footer>
</main>

<div class="film-info-backdrop" id="infoBackdrop">
  <div class="film-info-modal">
    <button class="film-info-close" id="closeInfo" aria-label="Close">×</button>
    <h2>Page information</h2>
    <div id="filmPageInfo"></div>
  </div>
</div>

<script>
(async function(){

  const cfg = window.KINORA_CONFIG || {};
  const host = document.getElementById("filmContent");
  const params = new URLSearchParams(location.search);
  const articleId = params.get("id");

  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){
    host.innerHTML = '<div class="film-error">KINORA configuration is missing. Check config.js.</div>';
    return;
  }

  if(!window.supabase){
    host.innerHTML = '<div class="film-error">Supabase could not load. Please refresh.</div>';
    return;
  }

  if(!articleId){
    host.innerHTML = '<div class="film-error">No film article ID was provided.</div>';
    return;
  }

  const db = window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);

  let currentArticle = null;
  let currentFilm = null;

  function esc(value){
    return String(value ?? "").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function firstBlock(article){
    const blocks = article.content_blocks;
    if(Array.isArray(blocks)){
      return blocks.find(b=>b && b.kind==="film") || blocks[0] || {};
    }
    if(blocks && typeof blocks==="object") return blocks;
    return {};
  }

  function firstPersonBlock(article){
    const blocks=article.content_blocks;
    if(Array.isArray(blocks)){
      return blocks.find(b=>b && (b.kind==="person"||b.kind==="people")) || blocks[0] || {};
    }
    if(blocks && typeof blocks==="object") return blocks;
    return {};
  }

  function list(value){
    return Array.isArray(value) ? value : [];
  }

  function showEmpty(message){
    return `<div class="film-empty">${esc(message)}</div>`;
  }

  function safeImage(url){
    if(typeof url!=="string") return "";
    try{
      const parsed = new URL(url,location.href);
      return ["http:","https:"].includes(parsed.protocol) ? parsed.href : "";
    }catch(e){return ""}
  }

  // Fetch current profile photos so Film articles don't keep displaying old cached URLs.
  async function refreshPeoplePhotos(film){
    const sections=["cast","crew","additional_crew"];
    const personIds=[...new Set(
      sections.flatMap(section=>
        list(film[section])
          .map(person=>person.person_id)
          .filter(id=>typeof id==="string" && id.trim())
      )
    )];

    if(!personIds.length) return film;

    try{
      const {data:peopleRows,error}=await db
        .from("articles")
        .select("id,content_blocks")
        .in("id",personIds)
        .eq("category","People")
        .eq("status","published");

      if(error) throw error;

      const photoMap=new Map();

      (peopleRows||[]).forEach(article=>{
        const person=firstPersonBlock(article);
        const photo=
          person.photo_url ||
          person.person_photo ||
          person.profile_photo ||
          person.photo ||
          "";

        photoMap.set(String(article.id),safeImage(photo));
      });

      sections.forEach(section=>{
        film[section]=list(film[section]).map(person=>{
          const latestPhoto=photoMap.get(String(person.person_id));
          if(latestPhoto){
            return {...person,person_photo:latestPhoto};
          }
          return person;
        });
      });

    }catch(error){
      // If the People lookup fails, keep the saved image URLs as a fallback.
      console.warn("Could not refresh People profile photos:",error);
    }

    return film;
  }

  function renderPeople(items,type){
    if(!items.length) return showEmpty("No "+type.toLowerCase()+" information available yet.");

    return `
      <div class="film-scroll">
        ${items.map(person=>{
          const name=person.name||"Unknown";
          const photo=safeImage(person.person_photo||person.photo_url||"");
          const personId=person.person_id;
          const role=person.role||person.position||"";
          const nameHTML=personId
            ? `<a class="film-person-name" href="person.html?id=${encodeURIComponent(personId)}">${esc(name)}</a>`
            : `<span class="film-person-name">${esc(name)}</span>`;

          return `
            <article class="film-person-card">
              ${photo
                ? `<img class="film-person-photo" src="${esc(photo)}" alt="${esc(name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;film-person-placeholder&quot;>👤</div>'">`
                : `<div class="film-person-placeholder">👤</div>`}
              ${nameHTML}
              <span class="film-person-role">${esc(role)}</span>
            </article>
          `;
        }).join("")}
      </div>
    `;
  }

  function dataRows(rows){
    const valid=rows.filter(row=>row[1]!==undefined&&row[1]!==null&&row[1]!=="");
    if(!valid.length) return showEmpty("No information available yet.");

    return `
      <div class="film-data-panel">
        ${valid.map(row=>`
          <div class="film-data-row">
            <span class="film-data-label">${esc(row[0])}</span>
            <span class="film-data-value">${esc(row[1])}</span>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderAdditionalCrew(items){
    if(!items.length) return showEmpty("No additional crew information available yet.");

    return `
      <div class="film-list">
        ${items.map(person=>{
          const photo=safeImage(person.person_photo||person.photo_url||"");
          const personId=person.person_id;
          const name=person.name||"Unknown";
          const role=person.position||person.role||"";

          return `
            <div class="film-list-item">
              ${photo
                ? `<img src="${esc(photo)}" alt="" loading="lazy">`
                : `<div class="film-list-icon">👤</div>`}
              <div>
                <strong>${personId
                  ? `<a href="person.html?id=${encodeURIComponent(personId)}" style="color:inherit;text-decoration:none">${esc(name)}</a>`
                  : esc(name)}</strong>
                <small>${esc(role)}</small>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderTheatrical(items){
    if(!items.length) return showEmpty("No theatrical release details available.");

    return `
      <div class="film-list">
        ${items.map(item=>`
          <div class="film-list-item">
            <div class="film-list-icon">${esc(item.flag||"🌍")}</div>
            <div>
              <strong>${esc(item.country||"Unknown country")}</strong>
              <small>${esc(item.date||"Date unavailable")}${item.certification?" · "+esc(item.certification):""}</small>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderDigital(items){
    if(!items.length) return showEmpty("No digital release details available.");

    return `
      <div class="film-list">
        ${items.map(item=>{
          const icon=safeImage(item.icon||"");
          return `
            <div class="film-list-item">
              ${icon
                ? `<img src="${esc(icon)}" alt="" style="width:43px;height:43px;border-radius:50%" loading="lazy">`
                : `<div class="film-list-icon">${esc((item.platform||"?").charAt(0).toUpperCase())}</div>`}
              <div>
                <strong>${esc(item.platform||"Platform")}</strong>
                <small>${esc(item.date||"Date unavailable")}</small>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderAwards(items){
    if(!items.length) return showEmpty("No awards or nominations listed yet.");

    return `
      <div class="film-list">
        ${items.map(award=>`
          <div class="film-award">
            <strong>${esc(award.name||"Award")}</strong>
            <p>${[award.category,award.result,award.recipient,award.year].filter(Boolean).map(esc).join(" · ")}</p>
          </div>
        `).join("")}
      </div>
    `;
  }

  // Supports the new multi-person credit arrays and older single-person fields.
  function getSoundtrackCredits(song,key,legacyKey){
    const value=song[key];

    if(Array.isArray(value)){
      return value.map(person=>{
        if(typeof person==="string"){
          return {name:person.trim(),person_id:""};
        }
        return {
          name:String(person?.name||"").trim(),
          person_id:person?.person_id||""
        };
      }).filter(person=>person.name);
    }

    const legacy=String(song[legacyKey]||"").trim();
    if(!legacy) return [];

    return legacy.split(",").map(name=>({
      name:name.trim(),
      person_id:""
    })).filter(person=>person.name);
  }

  function renderSoundtrackCredits(song){
    const roles=[
      ["music_directors","music_director","Music Director"],
      ["composers","composer","Composer"],
      ["singers","singer","Singer"],
      ["lyricists","lyricist","Lyricist"]
    ];

    const lines=roles.map(([key,legacy,label])=>{
      const people=getSoundtrackCredits(song,key,legacy);
      if(!people.length) return "";

      const names=people.map(person=>{
        const name=esc(person.name);
        return person.person_id
          ? `<a href="person.html?id=${encodeURIComponent(person.person_id)}">${name}</a>`
          : name;
      }).join('<span class="soundtrack-credit-separator">, </span>');

      return `
        <div class="soundtrack-credit-line">
          <span class="soundtrack-credit-label">${label}</span>
          <span class="soundtrack-credit-names">${names}</span>
        </div>
      `;
    }).filter(Boolean);

    return lines.join("");
  }

  function renderSoundtrack(items,film){
    if(!items.length) return showEmpty("No music or soundtrack information available.");

    const coverUrl=safeImage(
      film.soundtrack_cover ||
      items.find(song=>song.album_cover)?.album_cover ||
      ""
    );

    const cover=coverUrl
      ? `
        <div class="soundtrack-cover-area">
          <img class="soundtrack-cover" src="${esc(coverUrl)}" alt="Soundtrack album cover" loading="lazy">
          <div class="soundtrack-cover-caption">
            <strong>Music &amp; Soundtrack</strong><br>
            Official soundtrack / album artwork
          </div>
        </div>
      `
      : "";

    return `
      ${cover}
      <div class="film-list">
        ${items.map((song,index)=>{
          const title=song.title||song.name||"Untitled track";
          const credits=renderSoundtrackCredits(song);

          return `
            <article class="soundtrack-track">
              <div class="soundtrack-track-top">
                <div class="soundtrack-track-title">
                  ${String(index+1).padStart(2,"0")}. ${esc(title)}
                </div>
                ${song.duration
                  ? `<span class="soundtrack-duration">${esc(song.duration)}</span>`
                  : ""}
              </div>

              ${credits
                ? `<div class="soundtrack-credits">${credits}</div>`
                : ""}
            </article>
          `;
        }).join("")}
      </div>
    `;
  }

  function safeArticleHTML(source){
    const template=document.createElement("template");
    template.innerHTML=String(source||"");

    const allowed=new Set([
      "P","BR","H2","H3","H4","STRONG","B","I","EM","U",
      "UL","OL","LI","BLOCKQUOTE","A","IMG","HR",
      "TABLE","THEAD","TBODY","TR","TH","TD","CODE","PRE"
    ]);

    template.content.querySelectorAll("*").forEach(element=>{
      if(!allowed.has(element.tagName)){
        element.replaceWith(document.createTextNode(element.textContent||""));
        return;
      }

      [...element.attributes].forEach(attribute=>{
        const name=attribute.name.toLowerCase();
        if(name.startsWith("on")||name==="style"||name==="srcdoc"){
          element.removeAttribute(attribute.name);
        }
      });

      if(element.tagName==="A"){
        const href=element.getAttribute("href")||"";
        if(!/^https?:\/\//i.test(href)) element.removeAttribute("href");
        element.setAttribute("rel","noopener noreferrer");
        element.setAttribute("target","_blank");
      }

      if(element.tagName==="IMG"){
        const src=safeImage(element.getAttribute("src")||"");
        if(src) element.setAttribute("src",src);
        else element.remove();
        element.setAttribute("loading","lazy");
      }
    });

    return template.innerHTML;
  }

  function switchTab(tabName){
    document.querySelectorAll(".film-tab").forEach(button=>{
      const active=button.dataset.tab===tabName;
      button.classList.toggle("active",active);
      button.setAttribute("aria-selected",String(active));
    });

    document.querySelectorAll(".film-tab-content").forEach(panel=>{
      panel.hidden=panel.id!=="tab-"+tabName;
    });
  }

  function addTab(name,label){
    return `<button class="film-tab" type="button" data-tab="${esc(name)}" role="tab" aria-selected="false">${esc(label)}</button>`;
  }

  function openDedicatedEditor(key){
    if(!currentArticle) return;

    const allowedSections=[
      "overview",
      "cast",
      "crew",
      "additional_crew",
      "studios",
      "box_office",
      "soundtrack",
      "theatrical_releases",
      "digital_releases",
      "awards"
    ];

    if(!allowedSections.includes(key)) return;

    const url=new URL("film-editor.html",location.href);
    url.searchParams.set("id",currentArticle.id);
    url.searchParams.set("section",key);
    location.href=url.href;
  }

  function render(article,film){
    currentArticle=article;
    currentFilm=film;

    const title=article.title||"Untitled film";
    const year=film.year||"";

    document.title=title+" ("+year+") — KINORA";
    $("breadcrumbTitle").textContent=title;

    const crew=list(film.crew);

    const theatrical=list(film.theatrical_releases);

    const awards=list(film.awards);
    const soundtrack=list(film.soundtrack);

      ["releases","Release details"],
      ["awards","Awards"],
      ["soundtrack","Music & Soundtrack"]

    if(hasArticle) tabs.push(["article","Article"]);

    const totalCharacters=[
      article.title,article.summary,article.content,
      JSON.stringify(article.content_blocks||[]),article.body_source
    ].filter(Boolean).join("").length;

    const pageSize=new TextEncoder().encode(JSON.stringify(article)).length;

    host.innerHTML=`

      <div class="film-heading">
        <div>
          <h1>${esc(title)}</h1>
          <div class="film-year">${year?esc(year):"Year unavailable"}</div>
        </div>
        <button class="film-info-button" id="openInfo" type="button" aria-label="Page information">⋯</button>
      </div>

      <section class="film-hero">
        <div>
          ${poster
            ? `<img class="film-poster" src="${esc(poster)}" alt="${esc(title)} poster">`
            : `<div class="film-poster-placeholder">No poster available</div>`}
        </div>

        <div>
          <div class="film-facts">
            ${film.genre?`<span class="film-chip">${esc(film.genre)}</span>`:""}
            ${film.language?`<span class="film-chip">${esc(film.language)}</span>`:""}
            ${film.runtime?`<span class="film-chip">${esc(film.runtime)}</span>`:""}
          </div>
          <h2 class="film-plot-title">Plot</h2>
          <div class="film-plot">${esc(film.plot||article.summary||"No plot information available yet.")}</div>
        </div>
      </section>

      <div class="film-section-heading" style="justify-content:flex-end;margin-top:12px">
        <button class="film-edit-button" data-edit="overview" type="button">Suggest overview edit</button>
      </div>

      <section class="film-section">
        <div class="film-section-heading">
          <h2>Cast</h2>
          <span class="film-person-role">${cast.length} entries</span>
          <button class="film-edit-button" data-edit="cast" type="button">Suggest edit</button>
        </div>
        ${renderPeople(cast,"Cast")}
      </section>

      <section class="film-section">
        <div class="film-section-heading">
          <h2>Crew</h2>
          <span class="film-person-role">${crew.length} entries</span>
          <button class="film-edit-button" data-edit="crew" type="button">Suggest edit</button>
        </div>
        ${renderPeople(crew,"Crew")}
      </section>

      <section class="film-section">
        <div class="film-section-heading">
          <h2>Box office</h2>
          <button class="film-edit-button" data-edit="box_office" type="button">Suggest edit</button>
        </div>
        ${dataRows([
          ["Budget",box.budget],
          ["Worldwide gross",box.worldwide_gross],
          ["Domestic gross",box.domestic_gross],
          ["Overseas gross",box.overseas_gross],
          ["Verdict",box.verdict]
        ])}
      </section>

      <section class="film-section">
        <div class="film-section-heading">
          <h2>Production companies / Studios</h2>
          <button class="film-edit-button" data-edit="studios" type="button">Suggest edit</button>
        </div>
        ${Array.isArray(studios)
          ? dataRows(studios.map((s,i)=>["Studio "+(i+1),typeof s==="string"?s:s.name]))
          : dataRows([["Studios",studios]])}
      </section>

      <nav class="film-tabs" role="tablist" aria-label="More film information">
        ${tabs.map(t=>addTab(t[0],t[1])).join("")}
      </nav>

      <div class="film-tab-content" id="tab-additional" hidden>
        <div class="film-section-heading">
          <h3>Additional crew</h3>
          <button class="film-edit-button" data-edit="additional_crew" type="button">Suggest edit</button>
        </div>
        ${renderAdditionalCrew(additionalCrew)}
      </div>

      <div class="film-tab-content" id="tab-releases" hidden>
        <div class="film-section-heading">
          <h3>Theatrical releases</h3>
          <button class="film-edit-button" data-edit="theatrical_releases" type="button">Suggest edit</button>
        </div>
        ${renderTheatrical(theatrical)}

        <div class="film-section-heading" style="margin-top:25px">
          <h3>Digital releases</h3>
          <button class="film-edit-button" data-edit="digital_releases" type="button">Suggest edit</button>
        </div>
        ${renderDigital(digital)}
      </div>

      <div class="film-tab-content" id="tab-awards" hidden>
        <div class="film-section-heading">
          <h3>Awards</h3>
          <button class="film-edit-button" data-edit="awards" type="button">Suggest edit</button>
        </div>
        ${renderAwards(awards)}
      </div>

      <div class="film-tab-content" id="tab-soundtrack" hidden>
        <div class="film-section-heading">
          <h3>Music &amp; Soundtrack</h3>
          <button class="film-edit-button" data-edit="soundtrack" type="button">Suggest edit</button>
        </div>
        ${renderSoundtrack(soundtrack,film)}
      </div>

      ${hasArticle?`
        <div class="film-tab-content" id="tab-article" hidden>
          <div class="film-article-body">
            ${safeArticleHTML(article.body_source||article.content||"")}
          </div>
          ${Array.isArray(article.citations)&&article.citations.length
            ? `<h3>References</h3><ol>${article.citations.map(c=>{
                const citationUrl=safeImage(c.url||"");
                return citationUrl
                  ? `<li><a href="${esc(citationUrl)}" target="_blank" rel="noopener noreferrer">${esc(c.title||c.url)}</a></li>`
                  : "";
              }).join("")}</ol>`
            : ""}
        </div>
      `:""}
    `;

    // Every film section opens its own dedicated editor page.
    document.querySelectorAll("[data-edit]").forEach(button=>{
      button.addEventListener("click",()=>{
        openDedicatedEditor(button.dataset.edit);
      });
    });

    document.querySelectorAll(".film-tab").forEach(button=>{
      button.addEventListener("click",()=>{
        switchTab(button.dataset.tab);
      });
    });

    // Open Release Details by default.
    switchTab("releases");

    $("filmPageInfo").innerHTML=`
      <div class="film-data-panel">
        <div class="film-data-row"><span class="film-data-label">Page title</span><span class="film-data-value">${esc(title)}</span></div>
        <div class="film-data-row"><span class="film-data-label">Category</span><span class="film-data-value">Film</span></div>
        <div class="film-data-row"><span class="film-data-label">Characters</span><span class="film-data-value">${totalCharacters.toLocaleString()}</span></div>
        <div class="film-data-row"><span class="film-data-label">Article data size</span><span class="film-data-value">${pageSize.toLocaleString()} bytes</span></div>
        <div class="film-data-row"><span class="film-data-label">Cast entries</span><span class="film-data-value">${cast.length}</span></div>
        <div class="film-data-row"><span class="film-data-label">Crew entries</span><span class="film-data-value">${crew.length}</span></div>
        <div class="film-data-row"><span class="film-data-label">Created</span><span class="film-data-value">${esc(article.created_at?new Date(article.created_at).toLocaleDateString():"Unknown")}</span></div>
        <div class="film-data-row"><span class="film-data-label">Last updated</span><span class="film-data-value">${esc(article.updated_at?new Date(article.updated_at).toLocaleDateString():"Not recorded")}</span></div>
        <div class="film-data-row"><span class="film-data-label">Article ID</span><span class="film-data-value">${esc(article.id)}</span></div>
      </div>
    `;

    $("openInfo").addEventListener("click",()=>{
      $("infoBackdrop").classList.add("open");
    });
  }

  $("closeInfo").addEventListener("click",()=>{
    $("infoBackdrop").classList.remove("open");
  });

  $("infoBackdrop").addEventListener("click",event=>{
    if(event.target===$("infoBackdrop")){
      $("infoBackdrop").classList.remove("open");
    }
  });

  try{
    const {data:article,error}=await db
      .from("articles")
      .select("id,title,summary,content,content_blocks,body_source,citations,category,status,created_at,updated_at")
      .eq("id",articleId)
      .eq("category","Film")
      .eq("status","published")
      .maybeSingle();

    if(error) throw error;

    if(!article){
      host.innerHTML=`
        <div class="film-error">
          This film article is unavailable or has not been published yet.
        </div>
      `;
      return;
    }

    const film=firstBlock(article);

    if(film.kind!=="film"){
      host.innerHTML='<div class="film-error">This article does not contain valid film information.</div>';
      return;
    }
// Record one visit to this published film page.
const {error:viewError} = await db
  .from("page_views")
  .insert({
    article_id: article.id,
    category: "Film"
  });

if(viewError){
  console.warn("Could not record film page view:", viewError);
}
    await refreshPeoplePhotos(film);
    render(article,film);

  }catch(error){
    console.error(error);
    host.innerHTML=`
      <div class="film-error">
        Could not load this film article.<br>
        ${esc(error.message)}
      </div>
    `;
  }

})();
</script>
