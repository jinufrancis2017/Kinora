
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Redirecting | KINORA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <p>Redirecting to KINORA...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function redirectArticle() {
      if (!id) {
        window.location.replace("index.html");
        return;
      }

      const db = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

      const { data, error } = await db
        .from("articles")
        .select("category")
        .eq("id", id)
        .eq("status", "published")
        .maybeSingle();

      if (error || !data) {
        window.location.replace("index.html");
        return;
      }

      const category = data.category.toLowerCase();

      if (category === "film" || category === "films" ||
          category === "series" || category === "tv series") {
        window.location.replace("film.html?id=" + encodeURIComponent(id));
      } else if (category === "people" || category === "person") {
        window.location.replace("person.html?id=" + encodeURIComponent(id));
      } else {
        window.location.replace("index.html");
      }
    }

    redirectArticle();
  </script>
</body>
</html>
