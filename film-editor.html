<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Film Editor | KINORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#090b12;--panel:rgba(25,31,46,.76);--inner:rgba(10,15,26,.78);
  --border:rgba(180,195,225,.14);--text:#f3f5fb;--muted:#9ba7bd;
  --accent:var(--kinora-accent,#c7f36b);--danger:#ff8997;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:Arial,sans-serif;
  background:radial-gradient(ellipse at 15% 0%,rgba(110,105,255,.15),transparent 38%),
  radial-gradient(ellipse at 90% 25%,rgba(80,190,170,.09),transparent 35%),
  linear-gradient(145deg,#090b12,#101522 55%,#090b12);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{
  height:66px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--border);
  background:rgba(9,12,20,.76);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:10
}
.logo{font-size:21px;font-weight:900;letter-spacing:2px;color:var(--text);text-decoration:none}
.logo span{color:var(--accent)}
.topbar a.back{color:var(--muted);font-size:13px;text-decoration:none}
main{max-width:900px;margin:38px auto;padding:0 18px 75px}
.eyebrow{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:2.5px}
h1{font-size:clamp(26px,5vw,35px);margin:11px 0}
.description,.help{color:var(--muted);font-size:13px;line-height:1.75}
.editor-panel{
  margin-top:26px;padding:25px;
  background:linear-gradient(145deg,rgba(30,38,56,.88),rgba(15,20,32,.88));
  border:1px solid var(--border);border-radius:22px;
  box-shadow:0 22px 65px #0005,inset 0 1px 0 #ffffff0c;
  backdrop-filter:blur(22px)
}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-heading h2{font-size:21px;margin:0}
.count{font-size:12px;color:var(--muted)}
.help{margin:12px 0 24px}
.field{margin:18px 0;position:relative}
.field label,.field-label{
  display:block;color:var(--muted);font-size:10px;font-weight:900;
  letter-spacing:1.2px;margin-bottom:9px
}
.field input,.field textarea,.field select,.role-input{
  width:100%;background:var(--inner);color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:14px;
  outline:none;transition:.2s;box-shadow:inset 0 1px 5px #0003
}
.field textarea{min-height:115px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus,.role-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)
}
.search-results{
  display:none;margin-top:8px;background:#111827;
  border:1px solid var(--border);border-radius:14px;overflow:hidden
}
.search-results.show{display:block}
.result-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:12px;
  border:0;border-bottom:1px solid var(--border);
  background:transparent;color:var(--text);text-align:left
}
.result-item:last-child{border-bottom:0}
.result-item:hover{background:#ffffff09}
.result-item img,.result-placeholder{
  width:45px;height:55px;object-fit:cover;border-radius:8px;
  background:#273143;flex-shrink:0
}
.result-placeholder{display:grid;place-items:center}
.result-name{font-size:13px;font-weight:bold}
.result-subtitle{display:block;font-size:11px;color:var(--muted);margin-top:5px}
.member-list{display:flex;flex-direction:column;gap:13px;margin-top:22px}
.member-card{
  background:linear-gradient(145deg,rgba(22,29,43,.94),rgba(12,17,28,.94));
  border:1px solid var(--border);border-radius:16px;padding:17px;
  box-shadow:inset 0 1px 0 #ffffff08
}
.member-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.member-top strong{font-size:13px}
.member-person{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.member-person img,.member-placeholder{
  width:55px;height:66px;border-radius:9px;object-fit:cover;background:#273143
}
.member-placeholder{display:grid;place-items:center;font-size:22px}
.member-name{font-weight:bold;font-size:14px}
.member-subtitle{font-size:11px;color:var(--muted);margin-top:5px}
.role-input{min-height:50px;resize:vertical}
.remove-button{
  background:#ff657510;color:var(--danger);
  border:1px solid #ff65752c;border-radius:9px;padding:8px 12px;font-size:12px
}
.entry-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.move-button{
  min-width:34px;height:32px;padding:0 9px;border:1px solid var(--border);
  border-radius:8px;background:#ffffff08;color:var(--text);font-size:15px;font-weight:800
}
.move-button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:#ffffff10}
.move-button:disabled{opacity:.25;cursor:not-allowed}
.member-top{flex-wrap:wrap}
.add-button{
  width:100%;margin-top:20px;min-height:56px;
  border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);
  border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);
  color:var(--accent);font-weight:800;font-size:14px;transition:.2s
}
.add-button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.cancel-button,.submit-button{border:1px solid var(--border);border-radius:11px;padding:14px 18px;font-weight:bold}
.cancel-button{background:#ffffff08;color:var(--muted)}
.submit-button{
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 75%,white));
  color:#10150a;border-color:transparent;
  box-shadow:0 5px 22px color-mix(in srgb,var(--accent) 18%,transparent)
}
.submit-button:disabled{opacity:.5;cursor:wait}
.status{margin-top:15px;font-size:12px;line-height:1.7;color:var(--muted);white-space:pre-wrap}
.status.error{color:var(--danger)}
.success-panel{display:none;text-align:center;padding:35px 10px}
.success-panel.show{display:block}
.success-icon{font-size:45px;color:var(--accent)}
.success-panel p{color:var(--muted);font-size:14px;line-height:1.7}
.success-panel a{display:inline-block;margin-top:15px;background:var(--accent);color:#10150a;text-decoration:none;padding:13px 18px;border-radius:10px;font-weight:bold}
.loading,.error-page{text-align:center;padding:55px 15px;color:var(--muted);line-height:1.7}
.error-page{color:var(--danger)}
.album-cover-preview{
  width:64px;height:64px;object-fit:cover;border-radius:9px;
  background:#273143;border:1px solid var(--border)
}
.track-card{padding:14px}
.track-card .member-top{margin-bottom:10px}
.track-fields{display:grid;grid-template-columns:1fr 125px;gap:10px}
.track-fields .field{margin:8px 0}
.credit-group{margin-top:13px}
.credit-heading{
  color:var(--muted);font-size:10px;font-weight:900;
  letter-spacing:1px;margin-bottom:7px
}
.credit-chips{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.credit-chip{
  display:flex;align-items:center;gap:7px;
  background:#ffffff0a;border:1px solid var(--border);
  border-radius:20px;padding:5px 9px;font-size:11px
}
.credit-chip button{
  border:0;background:none;color:var(--danger);padding:0;font-size:14px
}
.credit-add{
  width:100%;padding:10px;border-radius:9px;
  border:1px dashed var(--border);background:#ffffff05;
  color:var(--accent);text-align:left;font-size:12px
}
.credit-search{margin-top:8px}
.credit-search input{
  width:100%;padding:11px;border-radius:9px;
  background:var(--inner);border:1px solid var(--border);color:var(--text)
}
.album-area{
  display:flex;align-items:center;gap:13px;
  padding:12px;background:#ffffff06;border:1px solid var(--border);
  border-radius:13px;margin-bottom:17px
}
.album-area .field{flex:1;margin:0}

/* Crew role autocomplete */
.role-field{position:relative}
.role-suggestions{
  display:none;margin-top:7px;background:#111827;
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 30px #0005
}
.role-suggestions.show{display:block}
.role-suggestion{
  width:100%;display:block;text-align:left;
  padding:12px 14px;background:transparent;color:var(--text);
  border:0;border-bottom:1px solid var(--border);font-size:13px
}
.role-suggestion:last-child{border-bottom:0}
.role-suggestion:hover{background:#ffffff0b}
.role-suggestion strong{color:var(--accent)}
.role-suggestion.new-role{color:var(--accent)}
.role-hint{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.5}

@media(max-width:550px){
  .topbar{padding:0 14px}
  main{margin:25px auto;padding:0 12px 50px}
  .editor-panel{padding:17px;border-radius:17px}
  .footer-actions>*{flex:1}
  .track-fields{grid-template-columns:1fr 100px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="index.html">KINO<span>RA.</span></a>
  <a class="back" id="backLink" href="index.html">← Back to film</a>
</header>

<main>
  <div id="loading" class="loading">Loading film editor...</div>
  <div id="pageError" class="error-page" hidden></div>

  <div id="editor" hidden>
    <div>
      <div class="eyebrow">KINORA · FILM EDITOR</div>
      <h1 id="pageTitle">Edit section</h1>
      <div class="description" id="filmTitle"></div>
    </div>

    <section class="editor-panel">
      <div id="editorForm">
        <div class="panel-heading">
          <h2 id="sectionTitle"></h2>
          <span class="count" id="entryCount"></span>
        </div>
        <p class="help" id="sectionHelp"></p>
        <div id="formArea"></div>
        <div id="memberList" class="member-list"></div>
        <button id="addButton" class="add-button" type="button">+ Add entry</button>
        <div class="footer-actions">
          <button id="cancelButton" class="cancel-button" type="button">Cancel</button>
          <button id="submitButton" class="submit-button" type="button">Submit for review →</button>
        </div>
        <div id="status" class="status"></div>
      </div>

      <div id="successPanel" class="success-panel">
        <div class="success-icon">✓</div>
        <h2>Suggestion submitted!</h2>
        <p>Your proposed changes have been sent for moderator review. The public film page will only change after approval.</p>
        <a id="returnLink" href="#">Return to film page</a>
      </div>
    </section>
  </div>
</main>

<script>
(async function(){
  const cfg=window.KINORA_CONFIG||{};
  const params=new URLSearchParams(location.search);
  const articleId=params.get("id");
  const section=params.get("section")||"cast";
  const $=id=>document.getElementById(id);

  const creditFields={
    music_directors:{label:"Music Director(s)",legacy:"music_director"},
    composers:{label:"Composer(s)",legacy:"composer"},
    singers:{label:"Singer(s)",legacy:"singer"},
    lyricists:{label:"Lyricist(s)",legacy:"lyricist"}
  };

  const definitions={
    overview:{
      title:"Overview",type:"object",
      help:"Edit the film's main information. Existing values are loaded from the published film.",
      fields:[
        ["year","Release year","text"],
        ["language","Language","text"],
        ["genre","Genre","text"],
        ["runtime","Runtime","text"],
        ["poster_url","Poster image URL","url"],
        ["poster_credit","Poster credit","text"],
        ["plot","Plot","textarea"]
      ]
    },
    cast:{
      title:"Cast",type:"people",roleKey:"role",roleLabel:"CHARACTER / ROLE",
      help:"Search for published People articles and assign their character names."
    },
    crew:{
      title:"Crew",type:"people",roleKey:"position",roleLabel:"POSITION / ROLE",
      help:"Search for published People articles and select an existing crew position, or add a new one."
    },
    additional_crew:{
      title:"Additional Crew",type:"people",roleKey:"position",roleLabel:"POSITION / ROLE",
      help:"Search for published People articles and select an existing crew position, or add a new one."
    },
    studios:{
      title:"Production & Distribution",type:"object",
      help:"Enter the production house and the film's distribution company. You do not need to provide logos or icons.",
      fields:[
        ["production_house","Production House","text"],
        ["distribution","Distribution","text"]
      ]
    },
    soundtrack:{
      title:"Music & Soundtrack",type:"list",
      help:"Add songs and select multiple published People profiles for each music credit.",
      fields:[
        ["title","Song / track title","text"],
        ["duration","Duration","text"]
      ]
    },
    theatrical_releases:{
      title:"Theatrical Releases",type:"list",
      help:"Add theatrical release dates by country.",
      fields:[
        ["country","Country","text"],
        ["date","Theatrical release date","date"],
        ["certification","Certification","text"]
      ]
    },
    digital_releases:{
      title:"Digital Releases",type:"list",
      help:"Add streaming platforms and their digital release dates.",
      fields:[
        ["platform","Platform","text"],
        ["date","Digital release date","date"]
      ]
    },
    awards:{
      title:"Awards",type:"list",
      help:"Add awards, nominations, categories and recipients.",
      fields:[
        ["name","Award name","text"],
        ["category","Category","text"],
        ["result","Result (Won / Nominated)","text"],
        ["recipient","Recipient","text"],
        ["year","Year","text"]
      ]
    },
    box_office:{
      title:"Box Office",type:"object",
      help:"Update the film's collection information.",
      fields:[
        ["budget","Budget","text"],
        ["worldwide_gross","Worldwide gross","text"],
        ["domestic_gross","Domestic gross","text"],
        ["overseas_gross","Overseas gross","text"],
        ["verdict","Verdict","text"],
        ["source","Source / reference","text"]
      ]
    }
  };

  const config=definitions[section];
  let db,article,film;
  let entries=[];
  let albumCover="";
  let searchTimer;
  let searchSequence=0;
  let knownRoles=[];
  const roleTimers={};
  const roleSequences={};
  const creditTimers={};
  const creditSequences={};

  function esc(value){
    return String(value??"").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function imageURL(url){
    if(!url)return "";
    try{
      const u=new URL(url,location.href);
      return ["https:","http:"].includes(u.protocol)?u.href:"";
    }catch(e){return ""}
  }

  function showError(message){
    $("loading").hidden=true;
    $("editor").hidden=true;
    $("pageError").hidden=false;
    $("pageError").textContent=message;
  }

  function getBlocks(a){
    if(Array.isArray(a.content_blocks))return a.content_blocks;
    if(a.content_blocks&&typeof a.content_blocks==="object")return [a.content_blocks];
    return [];
  }

  function getPersonBlock(a){
    return getBlocks(a).find(b=>b.kind==="person")||{};
  }

  function updateCount(){
    $("entryCount").textContent=config.type==="object"?"Section details":entries.length+" entries";
  }

  function fieldHTML(key,label,type,value,idPrefix){
    const id=idPrefix+"-"+key;
    const safe=esc(value??"");
    if(type==="textarea"){
      return `<div class="field"><label for="${id}">${esc(label)}</label><textarea id="${id}" data-field="${key}">${safe}</textarea></div>`;
    }
    return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" data-field="${key}" type="${type}" value="${safe}"></div>`;
  }

  /* Load existing crew positions from published films. */
  async function loadKnownRoles(){
    const {data,error}=await db.from("articles")
      .select("content_blocks")
      .eq("category","Film")
      .eq("status","published")
      .limit(1000);

    if(error){
      console.warn("Could not load role suggestions:",error.message);
      return;
    }

    const roleMap=new Map();

    function addRole(value){
      const role=String(value||"").trim();
      if(!role)return;

      const key=role.toLowerCase();
      if(!roleMap.has(key))roleMap.set(key,role);
    }

    (data||[]).forEach(article=>{
      const filmBlock=getBlocks(article).find(block=>block.kind==="film");
      if(!filmBlock)return;

      ["crew","additional_crew"].forEach(sectionKey=>{
        const people=Array.isArray(filmBlock[sectionKey])?filmBlock[sectionKey]:[];

        people.forEach(person=>{
          const position=String(person.position||person.role||"").trim();
          if(!position)return;

          addRole(position);

          position.split(",").forEach(part=>{
            addRole(part);
          });
        });
      });
    });

    knownRoles=[...roleMap.values()].sort((a,b)=>a.localeCompare(b));
  }

  function isCrewRoleField(){
    return (section==="crew"||section==="additional_crew")&&config.roleKey==="position";
  }

  function renderObject(){
    $("formArea").innerHTML=config.fields.map(f=>
      fieldHTML(f[0],f[1],f[2],entries[0]?.[f[0]],"object")
    ).join("");
    $("memberList").innerHTML="";
    $("addButton").hidden=true;
    updateCount();
  }

  function renderAlbumCover(){
    const preview=imageURL(albumCover);
    return `
      <div class="album-area">
        ${preview
          ? `<img class="album-cover-preview" id="albumPreview" src="${esc(preview)}" alt="Album cover">`
          : `<div class="album-cover-preview" id="albumPreview"></div>`}
        <div class="field">
          <label for="albumCoverInput">ALBUM COVER IMAGE URL</label>
          <input id="albumCoverInput" type="url" placeholder="https://..." value="${esc(albumCover)}">
        </div>
      </div>`;
  }

  function renderCreditGroup(index,key){
    const label=creditFields[key].label;
    const people=entries[index][key]||[];
    const chips=people.map((person,i)=>`
      <span class="credit-chip">
        ${esc(person.name)}
        <button type="button" data-credit-remove="${key}" data-track="${index}" data-person="${i}" aria-label="Remove">×</button>
      </span>
    `).join("");

    return `
      <div class="credit-group">
        <div class="credit-heading">${esc(label.toUpperCase())}</div>
        <div class="credit-chips">${chips||'<span class="result-subtitle">No people added</span>'}</div>
        <button class="credit-add" type="button" data-credit-add="${key}" data-track="${index}">
          + Add ${esc(label.replace(/\(s\)/,"").toLowerCase())}
        </button>
        <div class="credit-search" id="credit-search-${index}-${key}" hidden>
          <input type="search" data-credit-input="${key}" data-track="${index}"
            placeholder="Search published People..." autocomplete="off">
          <div class="search-results" id="credit-results-${index}-${key}"></div>
        </div>
      </div>`;
  }

  function renderSoundtrack(){
    $("formArea").innerHTML=renderAlbumCover();
    $("addButton").hidden=false;

    $("memberList").innerHTML=entries.map((entry,index)=>`
      <article class="member-card track-card" data-entry="${index}">
        <div class="member-top">
          <strong>Track ${String(index+1).padStart(2,"0")}</strong>
          <div class="entry-actions">
            <button class="move-button" type="button" data-move-up="${index}" aria-label="Move track up" ${index===0?"disabled":""}>↑</button>
            <button class="move-button" type="button" data-move-down="${index}" aria-label="Move track down" ${index===entries.length-1?"disabled":""}>↓</button>
            <button class="remove-button" type="button" data-remove="${index}">Remove</button>
          </div>
        </div>
        <div class="track-fields">
          <div class="field">
            <label>SONG / TRACK TITLE</label>
            <input type="text" data-field="title" value="${esc(entry.title||"")}" placeholder="Song title">
          </div>
          <div class="field">
            <label>DURATION</label>
            <input type="text" data-field="duration" value="${esc(entry.duration||"")}" placeholder="3:45">
          </div>
        </div>
        ${Object.keys(creditFields).map(key=>renderCreditGroup(index,key)).join("")}
      </article>
    `).join("");

    attachReorderButtons(renderSoundtrack,readListFields);

    $("memberList").querySelectorAll("[data-remove]").forEach(button=>{
      button.addEventListener("click",()=>{
        readListFields();
        entries.splice(Number(button.dataset.remove),1);
        renderSoundtrack();
        updateCount();
      });
    });

    $("memberList").querySelectorAll("[data-credit-add]").forEach(button=>{
      button.addEventListener("click",()=>{
        const index=Number(button.dataset.track);
        const key=button.dataset.creditAdd;
        const area=$(`credit-search-${index}-${key}`);
        area.hidden=!area.hidden;
        if(!area.hidden)area.querySelector("input").focus();
      });
    });

    $("memberList").querySelectorAll("[data-credit-remove]").forEach(button=>{
      button.addEventListener("click",()=>{
        const index=Number(button.dataset.track);
        const key=button.dataset.creditRemove;
        entries[index][key].splice(Number(button.dataset.person),1);
        renderSoundtrack();
      });
    });

    $("memberList").querySelectorAll("[data-credit-input]").forEach(input=>{
      input.addEventListener("input",()=>{
        const index=Number(input.dataset.track);
        const key=input.dataset.creditInput;
        const query=input.value.trim();
        const searchKey=index+"-"+key;
        const results=$(`credit-results-${index}-${key}`);

        clearTimeout(creditTimers[searchKey]);
        const seq=(creditSequences[searchKey]||0)+1;
        creditSequences[searchKey]=seq;

        if(query.length<2){
          results.classList.remove("show");
          results.innerHTML="";
          return;
        }

        results.innerHTML='<div style="padding:13px;color:var(--muted)">Searching People...</div>';
        results.classList.add("show");

        creditTimers[searchKey]=setTimeout(()=>{
          searchCreditPeople(index,key,query,seq);
        },350);
      });
    });

    const coverInput=$("albumCoverInput");
    coverInput.addEventListener("input",()=>{
      albumCover=coverInput.value.trim();
      const preview=$("albumPreview");
      const url=imageURL(albumCover);
      if(url){
        preview.outerHTML=`<img class="album-cover-preview" id="albumPreview" src="${esc(url)}" alt="Album cover">`;
      }else{
        preview.outerHTML='<div class="album-cover-preview" id="albumPreview"></div>';
      }
    });

    updateCount();
  }

  async function searchCreditPeople(index,key,query,seq){
    const searchKey=index+"-"+key;
    const {data,error}=await db.from("articles")
      .select("id,title,content_blocks")
      .eq("category","People")
      .eq("status","published")
      .ilike("title","%"+query+"%")
      .limit(10);

    const results=$(`credit-results-${index}-${key}`);
    if(!results||seq!==creditSequences[searchKey])return;

    if(error){
      results.innerHTML=`<div style="padding:13px;color:var(--danger)">Search failed: ${esc(error.message)}</div>`;
      return;
    }

    if(!data?.length){
      results.innerHTML='<div style="padding:13px;color:var(--muted)">No published People articles found.</div>';
      return;
    }

    const people=data.map(a=>{
      const p=getPersonBlock(a);
      return {
        person_id:a.id,
        name:a.title,
        person_photo:p.photo_url||p.person_photo||p.profile_photo||p.photo||""
      };
    });

    results.innerHTML=people.map((person,i)=>{
      const photo=imageURL(person.person_photo);
      return `
        <button type="button" class="result-item" data-credit-result="${i}">
          ${photo?`<img src="${esc(photo)}" alt="">`:`<span class="result-placeholder">👤</span>`}
          <span>
            <span class="result-name">${esc(person.name)}</span>
            <span class="result-subtitle">Published People article</span>
          </span>
        </button>`;
    }).join("");

    results.querySelectorAll("[data-credit-result]").forEach(button=>{
      button.addEventListener("click",()=>{
        const person=people[Number(button.dataset.creditResult)];
        const selected=entries[index][key]||[];

        if(selected.some(p=>p.person_id===person.person_id)){
          results.innerHTML='<div style="padding:13px;color:var(--muted)">This person is already added.</div>';
          return;
        }

        selected.push(person);
        entries[index][key]=selected;
        renderSoundtrack();
      });
    });
  }

  function renderList(){
    if(section==="soundtrack"){
      renderSoundtrack();
      return;
    }

    $("formArea").innerHTML="";
    $("addButton").hidden=false;

    $("memberList").innerHTML=entries.map((entry,index)=>`
      <article class="member-card" data-entry="${index}">
        <div class="member-top">
          <strong>Entry ${index+1}</strong>
          <div class="entry-actions">
            <button class="move-button" type="button" data-move-up="${index}" aria-label="Move entry up" ${index===0?"disabled":""}>↑</button>
            <button class="move-button" type="button" data-move-down="${index}" aria-label="Move entry down" ${index===entries.length-1?"disabled":""}>↓</button>
            <button class="remove-button" type="button" data-remove="${index}">Remove</button>
          </div>
        </div>
        ${config.fields.map(f=>fieldHTML(f[0],f[1],f[2],entry[f[0]],"entry-"+index)).join("")}
      </article>
    `).join("");

    attachReorderButtons(renderList,readListFields);

    $("memberList").querySelectorAll("[data-remove]").forEach(button=>{
      button.addEventListener("click",()=>{
        readListFields();
        entries.splice(Number(button.dataset.remove),1);
        renderList();
      });
    });

    updateCount();
  }

  function renderPeople(){
    $("formArea").innerHTML=`
      <div class="field">
        <label for="peopleSearch">SEARCH PUBLISHED PEOPLE ARTICLES</label>
        <input id="peopleSearch" type="search" placeholder="Type a person's name" autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>`;
    $("addButton").hidden=true;
    renderPeopleList();

    $("peopleSearch").addEventListener("input",()=>{
      clearTimeout(searchTimer);
      const q=$("peopleSearch").value.trim();
      const seq=++searchSequence;
      if(q.length<2){$("searchResults").classList.remove("show");return}
      $("searchResults").innerHTML='<div style="padding:13px;color:var(--muted)">Searching...</div>';
      $("searchResults").classList.add("show");
      searchTimer=setTimeout(()=>searchPeople(q,seq),350);
    });
  }

  function renderPeopleList(){
    $("memberList").innerHTML=entries.map((person,index)=>{
      const photo=imageURL(person.person_photo);
      const role=person[config.roleKey]||"";
      const roleAutocomplete=isCrewRoleField();

      return `
        <article class="member-card">
          <div class="member-top">
            <strong>Entry ${index+1}</strong>
            <div class="entry-actions">
              <button class="move-button" type="button" data-move-up="${index}" aria-label="Move entry up" ${index===0?"disabled":""}>↑</button>
              <button class="move-button" type="button" data-move-down="${index}" aria-label="Move entry down" ${index===entries.length-1?"disabled":""}>↓</button>
              <button class="remove-button" type="button" data-remove="${index}">Remove</button>
            </div>
          </div>
          <div class="member-person">
            ${photo?`<img src="${esc(photo)}" alt="">`:`<div class="member-placeholder">👤</div>`}
            <div>
              <div class="member-name">${esc(person.name)}</div>
              <div class="member-subtitle">Published People article</div>
            </div>
          </div>
          <div class="field ${roleAutocomplete?"role-field":""}">
            <label>${esc(config.roleLabel)}</label>
            <input
              class="role-input"
              data-role="${index}"
              value="${esc(role)}"
              placeholder="${roleAutocomplete?"Search or enter a crew position":"Enter character name"}"
              autocomplete="off">
            ${roleAutocomplete?`
              <div class="role-suggestions" id="role-suggestions-${index}"></div>
              <div class="role-hint">Select an existing position or use a new role if it isn't listed.</div>
            `:""}
          </div>
        </article>`;
    }).join("");

    attachReorderButtons(renderPeopleList,readPeopleFields);

    $("memberList").querySelectorAll("[data-remove]").forEach(button=>{
      button.addEventListener("click",()=>{
        readPeopleFields();
        entries.splice(Number(button.dataset.remove),1);
        renderPeopleList();
      });
    });

    $("memberList").querySelectorAll("[data-role]").forEach(input=>{
      input.addEventListener("input",()=>{
        const index=Number(input.dataset.role);
        entries[index][config.roleKey]=input.value;

        if(isCrewRoleField()){
          showRoleSuggestions(index,input.value);
        }
      });

      if(isCrewRoleField()){
        input.addEventListener("focus",()=>{
          if(input.value.trim())showRoleSuggestions(Number(input.dataset.role),input.value);
        });

        input.addEventListener("keydown",event=>{
          if(event.key==="Escape"){
            const box=$(`role-suggestions-${input.dataset.role}`);
            if(box)box.classList.remove("show");
          }

          if(event.key==="Enter"){
            const box=$(`role-suggestions-${input.dataset.role}`);
            const first=box?.querySelector("[data-role-choice]");
            if(first){
              event.preventDefault();
              chooseRole(Number(input.dataset.role),first.dataset.roleChoice);
            }
          }
        });
      }
    });

    updateCount();
  }

  function showRoleSuggestions(index,query){
    const box=$(`role-suggestions-${index}`);
    if(!box)return;

    clearTimeout(roleTimers[index]);
    const seq=(roleSequences[index]||0)+1;
    roleSequences[index]=seq;

    const value=String(query||"").trim();

    if(!value){
      box.classList.remove("show");
      box.innerHTML="";
      return;
    }

    roleTimers[index]=setTimeout(()=>{
      if(seq!==roleSequences[index])return;

      const matches=knownRoles
        .filter(role=>role.toLowerCase().includes(value.toLowerCase()))
        .slice(0,8);

      const exactMatch=knownRoles.some(role=>role.toLowerCase()===value.toLowerCase());

      let html=matches.map(role=>`
        <button type="button" class="role-suggestion"
          data-role-choice="${esc(role)}">
          ${esc(role)}
        </button>
      `).join("");

      if(!exactMatch){
        html+=`
          <button type="button" class="role-suggestion new-role"
            data-role-new="${index}">
            + Use "${esc(value)}" as a new role
          </button>`;
      }

      if(!html){
        html='<div style="padding:12px;color:var(--muted);font-size:12px">No matching roles found.</div>';
      }

      box.innerHTML=html;
      box.classList.add("show");

      box.querySelectorAll("[data-role-choice]").forEach(button=>{
        button.addEventListener("click",()=>{
          chooseRole(index,button.dataset.roleChoice);
        });
      });

      box.querySelectorAll("[data-role-new]").forEach(button=>{
        button.addEventListener("click",()=>{
          const input=$(`role-input-${index}`)||$("memberList").querySelector(`[data-role="${index}"]`);
          const current=input?.value.trim()||value;
          chooseRole(index,current);
        });
      });
    },100);
  }

  function chooseRole(index,role){
    const value=String(role||"").trim();
    if(!entries[index]||!value)return;

    entries[index][config.roleKey]=value;

    const input=$("memberList").querySelector(`[data-role="${index}"]`);
    if(input)input.value=value;

    const box=$(`role-suggestions-${index}`);
    if(box){
      box.classList.remove("show");
      box.innerHTML="";
    }
  }

  function readListFields(){
    $("memberList").querySelectorAll("[data-entry]").forEach(card=>{
      const index=Number(card.dataset.entry);
      card.querySelectorAll("[data-field]").forEach(input=>{
        entries[index][input.dataset.field]=input.value.trim();
      });
    });

    if(section==="soundtrack"){
      albumCover=$("albumCoverInput")?.value.trim()||albumCover;
    }
  }

  function readPeopleFields(){
    $("memberList").querySelectorAll("[data-role]").forEach(input=>{
      entries[Number(input.dataset.role)][config.roleKey]=input.value.trim();
    });
  }

  /* Reorder entries without losing any unsaved field or credit changes. */
  function attachReorderButtons(renderFunction,readFunction){
    $("memberList").querySelectorAll("[data-move-up],[data-move-down]").forEach(button=>{
      button.addEventListener("click",()=>{
        readFunction();
        const movingUp=button.hasAttribute("data-move-up");
        const index=Number(movingUp?button.dataset.moveUp:button.dataset.moveDown);
        const target=index+(movingUp?-1:1);
        if(target<0||target>=entries.length)return;
        [entries[index],entries[target]]=[entries[target],entries[index]];
        renderFunction();
        updateCount();
      });
    });
  }

  function readObjectFields(){
    const obj={};
    $("formArea").querySelectorAll("[data-field]").forEach(input=>{
      obj[input.dataset.field]=input.value.trim();
    });
    return obj;
  }

  async function searchPeople(query,seq){
    const {data,error}=await db.from("articles")
      .select("id,title,content_blocks")
      .eq("category","People").eq("status","published")
      .ilike("title","%"+query+"%").limit(10);

    if(seq!==searchSequence)return;
    const results=$("searchResults");
    if(error){
      results.innerHTML=`<div style="padding:13px;color:var(--danger)">Search failed: ${esc(error.message)}</div>`;
      return;
    }
    if(!data?.length){
      results.innerHTML='<div style="padding:13px;color:var(--muted)">No published People articles found.</div>';
      return;
    }

    const people=data.map(a=>{
      const p=getPersonBlock(a);
      return {person_id:a.id,name:a.title,person_photo:p.photo_url||p.person_photo||""};
    });

    results.innerHTML=people.map((p,i)=>{
      const photo=imageURL(p.person_photo);
      return `<button type="button" class="result-item" data-result="${i}">
        ${photo?`<img src="${esc(photo)}" alt="">`:`<span class="result-placeholder">👤</span>`}
        <span><span class="result-name">${esc(p.name)}</span><span class="result-subtitle">Published People article</span></span>
      </button>`;
    }).join("");

    results.querySelectorAll("[data-result]").forEach(button=>{
      button.addEventListener("click",()=>{
        const p=people[Number(button.dataset.result)];
        if(entries.some(x=>x.person_id===p.person_id)){
          $("status").textContent="This person is already in the list.";
          return;
        }
        readPeopleFields();
        entries.push({...p,[config.roleKey]:""});
        $("peopleSearch").value="";
        results.classList.remove("show");
        $("status").textContent="";
        renderPeopleList();
      });
    });
  }

  $("addButton").addEventListener("click",()=>{
    if(config.type==="list"){
      readListFields();
      const blank={};
      config.fields.forEach(f=>blank[f[0]]="");

      if(section==="soundtrack"){
        Object.keys(creditFields).forEach(key=>blank[key]=[]);
        blank.album_cover=albumCover;
      }

      entries.push(blank);
      if(section==="soundtrack")renderSoundtrack();
      else renderList();
    }
  });

  $("cancelButton").addEventListener("click",()=>{
    location.href="film.html?id="+encodeURIComponent(articleId);
  });

  $("submitButton").addEventListener("click",async()=>{
    const status=$("status");
    const button=$("submitButton");
    status.classList.remove("error");

    let proposed;

    if(config.type==="object"){
      proposed=readObjectFields();
      if(section==="studios"){
        proposed={
          production_house:String(proposed.production_house||"").trim(),
          distribution:String(proposed.distribution||"").trim()
        };
      }
    }else if(config.type==="people"){
      readPeopleFields();
      proposed=entries.map(p=>({
        name:p.name,
        person_id:p.person_id,
        person_photo:p.person_photo||"",
        [config.roleKey]:String(p[config.roleKey]||"").trim()
      }));
      if(proposed.some(p=>!p.name||!p.person_id||!p[config.roleKey])){
        status.textContent="Please complete every member's role or position.";
        status.classList.add("error");return;
      }
    }else{
      readListFields();
      proposed=entries;

      if(section==="soundtrack"){
        if(proposed.some(entry=>!String(entry.title||"").trim())){
          status.textContent="Please enter a title for every track.";
          status.classList.add("error");return;
        }

        proposed=proposed.map(entry=>{
          const track={...entry,album_cover:albumCover};

          Object.keys(creditFields).forEach(key=>{
            const people=Array.isArray(track[key])?track[key]:[];
            const legacy=creditFields[key].legacy;

            track[legacy]=people.map(p=>p.name).join(", ");
            track[legacy+"_person_id"]=people[0]?.person_id||"";
            track[legacy+"_person_photo"]=people[0]?.person_photo||"";
          });

          return track;
        });
      }

      if(section!=="soundtrack"&&proposed.some(entry=>
        config.fields.some(f=>!String(entry[f[0]]||"").trim())
      )){
        status.textContent="Please complete all required fields in each entry.";
        status.classList.add("error");return;
      }
    }

    const {data:{user},error:userError}=await db.auth.getUser();
    if(userError||!user){
      status.textContent="Please log in before submitting an edit.";
      status.classList.add("error");return;
    }

    button.disabled=true;
    button.textContent="Submitting...";

    const {error}=await db.from("film_section_edits").insert({
      article_id:article.id,
      section_key:section,
      proposed_data:proposed,
      status:"pending",
      submitted_by:user.id
    });

    button.disabled=false;
    button.textContent="Submit for review →";

    if(error){
      status.textContent="Submission failed: "+error.message;
      status.classList.add("error");return;
    }

    $("editorForm").hidden=true;
    $("successPanel").classList.add("show");
    $("returnLink").href="film.html?id="+encodeURIComponent(articleId);
  });

  async function init(){
    if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){showError("KINORA configuration is missing.");return}
    if(!window.supabase){showError("Supabase could not load.");return}
    if(!articleId){showError("Film article ID is missing.");return}
    if(!config){showError("This editing section is not supported.");return}

    db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);

    const {data:a,error}=await db.from("articles")
      .select("id,title,content_blocks,category,status")
      .eq("id",articleId).eq("category","Film").eq("status","published").maybeSingle();

    if(error){showError("Could not load film: "+error.message);return}
    if(!a){showError("Film article not found or not published.");return}

    article=a;
    film=getBlocks(a).find(b=>b.kind==="film");
    if(!film){showError("Film data block not found.");return}

    $("backLink").href="film.html?id="+encodeURIComponent(articleId);
    $("filmTitle").textContent=a.title||"Untitled film";
    $("pageTitle").textContent="Edit "+config.title;
    $("sectionTitle").textContent=config.title;
    $("sectionHelp").textContent=config.help;

    if(config.type==="object"){
      if(section==="overview"){
        entries=[{...film}];
      }else if(section==="studios"){
        const oldStudios=film.studios||film.production_companies||film.production_company||[];
        const studioObject=Array.isArray(oldStudios)
          ? {production_house:oldStudios.map(item=>typeof item==="string"?item:(item?.name||"")).filter(Boolean).join(", "),distribution:film.distribution||film.distributor||""}
          : (oldStudios&&typeof oldStudios==="object"?{...oldStudios}:{production_house:String(oldStudios||""),distribution:film.distribution||film.distributor||""});
        studioObject.production_house=studioObject.production_house||studioObject.production_company||"";
        studioObject.distribution=studioObject.distribution||studioObject.distributor||"";
        entries=[studioObject];
      }else{
        entries=[{...(film[section]||{})}];
      }
    }else{
      entries=Array.isArray(film[section])?film[section].map(x=>({...x})):[];
    }

    if(section==="soundtrack"){
      albumCover=film.soundtrack_cover||entries.find(x=>x.album_cover)?.album_cover||"";
      entries=entries.map(normalizeTrack);
    }

    $("loading").hidden=true;
    $("editor").hidden=false;

    if(config.type==="people"){
      if(isCrewRoleField())await loadKnownRoles();
      renderPeople();
    }else if(config.type==="list"){
      renderList();
    }else{
      renderObject();
    }
  }

  function normalizeCreditPeople(entry,key){
    if(Array.isArray(entry[key]))return entry[key];

    const legacy=creditFields[key].legacy;
    const name=String(entry[legacy]||"").trim();

    if(!name)return [];
    return [{
      name,
      person_id:entry[legacy+"_person_id"]||"",
      person_photo:entry[legacy+"_person_photo"]||""
    }];
  }

  function normalizeTrack(entry){
    const track={...entry};
    Object.keys(creditFields).forEach(key=>{
      track[key]=normalizeCreditPeople(track,key);
    });
    return track;
  }

  await init();
})();
</script>
</body>
</html>
