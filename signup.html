<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Create account — KINORA</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a class="brand" href="index.html">KINORA<span>.</span></a><nav><a href="index.html">Explore</a><a href="login.html" class="nav-pill">Log in</a></nav></header>
<main class="auth-wrap"><a class="back-link" href="index.html">← Back to KINORA</a><section class="auth-card"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your account</h1><p class="muted">Choose a username that will appear on your public profile.</p><form id="signupForm" class="form-stack"><label>Username<input id="signupUsername" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="e.g. jfxds" required><small>3–24 characters. Letters, numbers and underscores only.</small></label><label>Email address<input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password<input id="signupPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></label><button class="button primary full" type="submit">Create account</button></form><p id="signupMessage" class="form-message" role="status"></p><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></section></main></body></html>
