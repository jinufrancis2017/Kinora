
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Edit People Profile | KINORA</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root {
  --accent: #a78bfa;
  --muted: #9298a7;
  --border: rgba(255,255,255,.1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 15% 5%, rgba(167,139,250,.1), transparent 40%),
    #0b0d12;
  color: #f5f5f7;
  font-family: Arial, sans-serif;
}

.editor-page {
  width: min(760px, 92%);
  margin: auto;
  padding: 30px 0 70px;
}

.back-link {
  display: inline-block;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 25px;
  text-decoration: none;
}

.back-link:hover { color: var(--accent); }

.editor-card {
  padding: 28px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 22px;
  background: rgba(255,255,255,.045);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 20px 70px rgba(0,0,0,.25);
}

.eyebrow {
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

h1 {
  font-size: clamp(27px, 5vw, 38px);
  margin: 10px 0;
}

.intro {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 28px;
}

.field {
  margin-bottom: 19px;
}

.field label {
  display: block;
  color: #c5c9d3;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}

.field input,
.field textarea {
  width: 100%;
  padding: 13px 14px;
  color: #f5f5f7;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  font-family: inherit;
  font-size: 14px;
}

.field textarea {
  min-height: 105px;
  resize: vertical;
  line-height: 1.6;
}

.field input:focus,
.field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(167,139,250,.1);
}

.field input::placeholder,
.field textarea::placeholder {
  color: #686e7c;
}

.field-hint {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
  line-height: 1.5;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 14px;
}

.editor-divider {
  height: 1px;
  background: var(--border);
  margin: 25px 0;
}

.section-title {
  font-size: 15px;
  margin: 0 0 18px;
}

.notice {
  padding: 13px 15px;
  margin: 20px 0;
  border-radius: 12px;
  border: 1px solid rgba(167,139,250,.2);
  background: rgba(167,139,250,.07);
  color: #c4b5fd;
  font-size: 12px;
  line-height: 1.6;
}

.submit-btn {
  width: 100%;
  padding: 14px;
  border: 1px solid rgba(167,139,250,.5);
  border-radius: 12px;
  background: var(--accent);
  color: #0b0d12;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.submit-btn:hover {
  background: #c4b5fd;
  transform: translateY(-1px);
}

.submit-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.status-message {
  display: none;
  padding: 13px;
  margin-top: 16px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.6;
}

.status-message.error {
  display: block;
  color: #fca5a5;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.2);
}

.status-message.success {
  display: block;
  color: #86efac;
  background: rgba(34,197,94,.1);
  border: 1px solid rgba(34,197,94,.2);
}

.loading {
  text-align: center;
  color: var(--muted);
  padding: 50px 15px;
}

@media(max-width:600px) {
  .editor-page { padding-top: 20px; }
  .editor-card { padding: 20px; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<main class="editor-page">

  <a class="back-link" id="backLink" href="index.html">
    ← Back
  </a>

  <div class="editor-card" id="editorCard">
    <div class="loading">Loading profile editor...</div>
  </div>

</main>

<script>
const db = window.supabase.createClient(
  window.KINORA_CONFIG.SUPABASE_URL,
  window.KINORA_CONFIG.SUPABASE_ANON_KEY
);

const personId = new URLSearchParams(location.search).get("id");

let currentArticle = null;

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getPersonBlock(article) {
  const blocks = Array.isArray(article.content_blocks)
    ? article.content_blocks
    : article.content_blocks && typeof article.content_blocks === "object"
      ? [article.content_blocks]
      : [];

  return blocks.find(block => block.kind === "person")
    || blocks[0]
    || {};
}

function showMessage(message, type) {
  const box = $("statusMessage");
  if (!box) return;

  box.className = "status-message " + type;
  box.textContent = message;
}

function renderEditor(article, person) {
  $("backLink").href = `person.html?id=${encodeURIComponent(article.id)}`;

  $("editorCard").innerHTML = `
    <div class="eyebrow">KINORA · PEOPLE</div>

    <h1>Edit profile</h1>

    <p class="intro">
      Suggest changes to this person's published profile.
      Your submission will be reviewed before anything changes on KINORA.
    </p>

    <form id="personEditForm">

      <h3 class="section-title">Basic information</h3>

      <div class="field">
        <label for="title">Person's name *</label>
        <input id="title" type="text" required
          maxlength="200"
          value="${esc(article.title)}">
      </div>

      <div class="field">
        <label for="summary">Short description</label>
        <textarea id="summary"
          placeholder="A short introduction to this person...">${esc(article.summary || "")}</textarea>
      </div>

      <div class="form-grid">

        <div class="field">
          <label for="subtitle">Subtitle</label>
          <input id="subtitle" type="text"
            value="${esc(person.subtitle || "")}"
            placeholder="e.g. Indian filmmaker">
        </div>

        <div class="field">
          <label for="occupation">Occupation</label>
          <input id="occupation" type="text"
            value="${esc(person.occupation || "")}"
            placeholder="e.g. Actor, Director">
        </div>

      </div>

      <div class="editor-divider"></div>

      <h3 class="section-title">Personal details</h3>

      <div class="form-grid">

        <div class="field">
          <label for="dob">Date of birth</label>
          <input id="dob" type="text"
            value="${esc(person.date_of_birth || "")}"
            placeholder="e.g. 12 May 1980">
        </div>

        <div class="field">
          <label for="dod">Date of death</label>
          <input id="dod" type="text"
            value="${esc(person.date_of_death || "")}"
            placeholder="Leave empty if alive">
        </div>

        <div class="field">
          <label for="birthplace">Birthplace</label>
          <input id="birthplace" type="text"
            value="${esc(person.birthplace || "")}">
        </div>

        <div class="field">
          <label for="deathplace">Place of death</label>
          <input id="deathplace" type="text"
            value="${esc(person.deathplace || "")}">
        </div>

      </div>

      <div class="editor-divider"></div>

      <h3 class="section-title">Profile photograph</h3>

      <div class="field">
        <label for="photo">Photo URL</label>
        <input id="photo" type="url"
          value="${esc(person.photo_url || "")}"
          placeholder="https://example.com/photo.jpg">
        <span class="field-hint">
          Enter a direct image URL beginning with https://
        </span>
      </div>

      <div class="notice">
        Filmography is generated automatically from published Film articles.
        It cannot be edited from this page.
      </div>

      <button class="submit-btn" id="submitBtn" type="submit">
        Submit changes for review
      </button>

      <div id="statusMessage" class="status-message"></div>

    </form>
  `;

  $("personEditForm").addEventListener("submit", submitEdit);
}

async function submitEdit(event) {
  event.preventDefault();

  const button = $("submitBtn");
  button.disabled = true;
  button.textContent = "Submitting...";

  try {
    const title = $("title").value.trim();

    if (!title) {
      throw new Error("Person's name is required.");
    }

    const photo = $("photo").value.trim();

    if (photo) {
      const parsed = new URL(photo);

      if (!["https:", "http:"].includes(parsed.protocol)) {
        throw new Error("Please enter a valid photo URL.");
      }
    }

    const personBlock = {
      kind: "person",
      version: 1,
      subtitle: $("subtitle").value.trim(),
      occupation: $("occupation").value.trim(),
      date_of_birth: $("dob").value.trim(),
      date_of_death: $("dod").value.trim(),
      birthplace: $("birthplace").value.trim(),
      deathplace: $("deathplace").value.trim(),
      photo_url: photo
    };

    const { data, error } = await db.rpc(
      "submit_person_profile_edit",
      {
        p_article_id: currentArticle.id,
        p_title: title,
        p_summary: $("summary").value.trim(),
        p_content_blocks: [personBlock],
        p_body_source: currentArticle.body_source || null
      }
    );

    if (error) throw error;

    if (!data || data.success !== true) {
      throw new Error("The submission could not be confirmed.");
    }

    showMessage(
      "Your profile changes have been submitted successfully. They will appear after moderator approval.",
      "success"
    );

    button.textContent = "Submitted for review";

  } catch (error) {
    console.error(error);
    showMessage(error.message || "Something went wrong.", "error");

    button.disabled = false;
    button.textContent = "Submit changes for review";
  }
}

async function loadEditor() {
  if (!personId) {
    $("editorCard").innerHTML = `
      <div class="loading">
        No People profile ID was provided.
      </div>
    `;
    return;
  }

  try {
    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      $("editorCard").innerHTML = `
        <div class="loading">
          <h2>Login required</h2>
          <p>You must log in before editing a People profile.</p>
          <a class="back-link" href="profile.html">Go to login</a>
        </div>
      `;
      return;
    }

    const { data: article, error } = await db
      .from("articles")
      .select("id,title,summary,content_blocks,body_source,category,status")
      .eq("id", personId)
      .eq("category", "People")
      .eq("status", "published")
      .maybeSingle();

    if (error) throw error;

    if (!article) {
      throw new Error("This published People profile could not be found.");
    }

    currentArticle = article;

    const person = getPersonBlock(article);

    renderEditor(article, person);

    document.title = `Edit ${article.title} | KINORA`;

  } catch (error) {
    console.error(error);

    $("editorCard").innerHTML = `
      <div class="loading">
        <h2>Unable to load editor</h2>
        <p>${esc(error.message)}</p>
      </div>
    `;
  }
}

loadEditor();
</script>

</body>
</html>
